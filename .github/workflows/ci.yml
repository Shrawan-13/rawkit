name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One CI run per ref. Superseded runs are cancelled to save minutes and keep the
# cache warm for the run that actually matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Gradle's own cache management: dependency cache, build cache, configuration
      # cache, and automatic cleanup of stale entries. setup-java is deliberately
      # used *without* `cache: gradle` so there is exactly one cache owner.
      # The exact number of retained caches is enforced by the prune-caches job.
      #
      # `gradle-home-cache-includes` must list the version-specific directory as
      # well as `caches`: that directory holds Gradle's execution history, and
      # without it every task re-executes instead of reporting UP-TO-DATE.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: always
          gradle-home-cache-includes: |
            caches
            wrapper
            8.10.2

      # The runner image already ships the Android SDK. android-actions/setup-android
      # is deliberately not used: it invokes `sdkmanager tools`, a package that no
      # longer exists, and fails on current runner images.
      - name: Ensure Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found on this runner"
            exit 1
          fi

          missing=()
          [ -d "$SDK/platforms/android-35" ] || missing+=("platforms;android-35")
          [ -d "$SDK/build-tools/35.0.0" ] || missing+=("build-tools;35.0.0")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Installing: ${missing[*]}"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "${missing[@]}"
          else
            echo "Android SDK packages already present."
          fi

      # Build cache + configuration cache are on in gradle.properties, so
      # unchanged modules are restored rather than recompiled.
      - name: Assemble and test
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: always
          gradle-home-cache-includes: |
            caches
            wrapper
            8.10.2

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found on this runner"
            exit 1
          fi

          missing=()
          [ -d "$SDK/platforms/android-35" ] || missing+=("platforms;android-35")
          [ -d "$SDK/build-tools/35.0.0" ] || missing+=("build-tools;35.0.0")
          if [ ${#missing[@]} -gt 0 ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "${missing[@]}"
          fi

      # Lint runs in its own job so it overlaps the build instead of extending it.
      - name: Run lint
        run: ./gradlew lintDebug --console=plain

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # Runs last, after the build. Keeps the repository's Actions cache at the
  # 20 most recently used entries so that cache writes stay fast and the
  # cache never becomes the slowest part of the build.
  # ---------------------------------------------------------------------
  prune-caches:
    name: Prune caches
    needs: [build, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete all but the 20 most recently used caches
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: '20'
        shell: bash
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          api="/repos/${owner}/${repo}/actions/caches"

          echo "Fetching caches for ${owner}/${repo}..."
          gh api --paginate --slurp "${api}?per_page=100" > /tmp/caches.json

          total=$(jq '[.[].actions_caches[]] | length' /tmp/caches.json)
          echo "Total caches: ${total}"

          if [ "${total}" -le "${KEEP}" ]; then
            echo "Nothing to prune (${total} <= ${KEEP})."
            exit 0
          fi

          # Sort by last_accessed_at (newest first) and drop the first KEEP entries.
          jq -r --argjson keep "${KEEP}" \
            '[.[].actions_caches[]] | sort_by(.last_accessed_at) | reverse | .[$keep:] | .[].id' \
            /tmp/caches.json > /tmp/stale_ids.txt

          stale=$(grep -c . /tmp/stale_ids.txt || true)
          echo "Deleting ${stale} stale caches..."

          while read -r id; do
            [ -n "$id" ] || continue
            gh api -X DELETE "${api}/${id}" --silent && echo "  deleted ${id}"
          done < /tmp/stale_ids.txt

          echo "Prune complete."
